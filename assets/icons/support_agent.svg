<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#c91f2d"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6ebf2"/>
      <stop offset="100%" stop-color="#7d8795"/>
    </linearGradient>

    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202a36"/>
      <stop offset="100%" stop-color="#0b1119"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer dark badge -->
  <path
    d="M100 10
       L164 42
       L184 100
       L164 158
       L100 190
       L36 158
       L16 100
       L36 42 Z"
    fill="url(#dark)"
    stroke="#273241"
    stroke-width="4"
  />

  <!-- Red ribbon -->
  <path
    d="M36 42
       L100 10
       L134 27
       L72 58
       L72 122
       L36 104 Z"
    fill="url(#red)"
    filter="url(#glow)"
  />

  <!-- Silver ribbon -->
  <path
    d="M164 42
       L100 10
       L66 27
       L128 58
       L128 122
       L164 104 Z"
    fill="url(#silver)"
  />

  <!-- Red lower ribbon -->
  <path
    d="M36 104
       L72 122
       L128 93
       L128 122
       L100 190
       L36 158
       Z"
    fill="url(#red)"
    filter="url(#glow)"
  />

  <!-- Dark central panel -->
  <path
    d="M72 58
       L128 58
       L150 100
       L128 142
       L72 142
       L50 100 Z"
    fill="#111821"
    stroke="#354050"
    stroke-width="3"
  />

  <!-- Gear -->
  <g transform="translate(100 100)">
    <path
      d="
      M-8 -35
      L8 -35
      L12 -24
      L23 -20
      L33 -26
      L42 -17
      L36 -7
      L40 4
      L52 8
      L52 24
      L40 28
      L36 39
      L42 50
      L33 59
      L22 53
      L12 57
      L8 68
      L-8 68
      L-12 57
      L-23 53
      L-33 59
      L-42 50
      L-36 39
      L-40 28
      L-52 24
      L-52 8
      L-40 4
      L-36 -7
      L-42 -17
      L-33 -26
      L-23 -20
      L-12 -24
      Z"
      transform="scale(0.52)"
      fill="#f4f7fb"
    />

    <circle
      cx="0"
      cy="0"
      r="19"
      fill="#17202a"
      stroke="#f4f7fb"
      stroke-width="6"
    />

    <circle
      cx="0"
      cy="0"
      r="7"
      fill="#f4f7fb"
    />
  </g>

  <!-- Utility / connection line -->
  <path
    d="M91 109 L62 138"
    stroke="#ff3f46"
    stroke-width="7"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <circle
    cx="57"
    cy="143"
    r="10"
    fill="#111821"
    stroke="#ff3f46"
    stroke-width="5"
  />

  <path
    d="M109 91 L138 62"
    stroke="#ff3f46"
    stroke-width="7"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <circle
    cx="143"
    cy="57"
    r="10"
    fill="#111821"
    stroke="#ff3f46"
    stroke-width="5"
  />
</svg>
